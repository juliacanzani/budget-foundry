[project]
name = "budget-foundry"
version = "0.1.0"
description = "Turn photographed handwriting sheets into a web font with cycling alternates."
requires-python = ">=3.12"
dependencies = [
    "opencv-python-headless",
    "scikit-image",
    "pillow",
    "pillow-heif",
    "potracer",
    "fonttools",
    "uharfbuzz",
    "brotli",
    "numpy",
    "typer",
    "reportlab>=5.1.0",
    "pypdfium2>=5.14.0",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
budget-foundry = "budget_foundry.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]
[tool.pytest.ini_options]
pythonpath = ["tests"]
