# Characters this font covers. `drawn` are written on the sheets; `derived` are made
# from another glyph at build time. Coverage is checked against this list.
drawn = '''0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz.,:;…!?'"“”-–—_()[]{}<>«»/\|+=×÷%*#@&~$^`'''

# Curly singles from one stroke of each kept double quote: `half` picks the stroke.
# A decision overrides it (decisions.json: "‘": {"keep": ["<candidate>#<component>", ...]}).
[derived."‘"]
from = "“"
method = "component"
half = "left"

[derived."’"]
from = "”"
method = "component"
half = "right"

# Middle dot and bullet from the default period, centred on the math axis.
[derived."·"]
from = "."
method = "scale"
scale = 1.0
centre = "axis"

[derived."•"]
from = "."
method = "scale"
scale = 1.45
centre = "axis"
